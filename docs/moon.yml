$schema: '../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'vitepress dev .'
    options:
      cache: false
      persistent: true
      runInCI: false

  build:
    command: 'vitepress build .'
    inputs:
      - '**/*.md'
      - '.vitepress/**/*'
    outputs:
      - '.vitepress/dist'
    options:
      runInCI: 'always'
