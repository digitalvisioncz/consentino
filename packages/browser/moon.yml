$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'library'

tasks:
  build:
    command: 'vite build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    outputs:
      - 'dist'
    options:
      runInCI: 'always'

  pack:
    command: 'pnpm pack --dry-run'
    deps:
      - 'build'
    options:
      cache: false
      runInCI: false
