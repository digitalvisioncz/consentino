name: Release packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mode:
    name: Select release mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          moon-version: 2.5.3
          proto-version: 0.61.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build projects
        run: moon run :build

      - name: Select Changesets mode
        id: changesets
        uses: changesets/action/select-mode@v2.1.1

  version:
    name: Update release pull request
    if: needs.mode.outputs.mode == 'version'
    needs: mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          moon-version: 2.5.3
          proto-version: 0.61.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        uses: changesets/action/version@v2.1.1
        with:
          script: moon run root:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  publish:
    name: Publish packages
    if: needs.mode.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          moon-version: 2.5.3
          proto-version: 0.61.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect package
        run: moon run :build browser:pack

      - name: Publish with provenance
        uses: changesets/action/publish@v2.1.1
        with:
          script: moon run root:release
          create-github-releases: true
