name: Release packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish npm packages
    if: needs.release.outputs.created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          moon-version: 2.5.3
          proto-version: 0.61.1

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect packages
        run: moon run :build root:release-check cookiebot:pack cookieyes:pack

      - name: Pack npm packages
        run: |
          mkdir -p "$RUNNER_TEMP/consentino-packages"
          pnpm --dir packages/cookiebot pack --pack-destination "$RUNNER_TEMP/consentino-packages"
          pnpm --dir packages/cookieyes pack --pack-destination "$RUNNER_TEMP/consentino-packages"

      - name: Publish npm packages
        run: |
          npm publish "$RUNNER_TEMP/consentino-packages/consentino-cookiebot-${{ needs.release.outputs.version }}.tgz" --access public
          npm publish "$RUNNER_TEMP/consentino-packages/consentino-cookieyes-${{ needs.release.outputs.version }}.tgz" --access public
