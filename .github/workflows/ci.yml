name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          moon-version: 2.5.3
          proto-version: 0.61.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Moon CI graph
        run: moon ci

      - name: Inspect browser package
        run: moon run browser:pack
